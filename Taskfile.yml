# Task runner — https://taskfile.dev
# Install: go install github.com/go-task/task/v3/cmd/task@latest
version: "3"

dotenv: [".env"]

vars:
  # The gateway hosts every service in one process (monolith mode).
  API_DIR: services/gateway

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  bootstrap:
    desc: Install all JS deps + Go deps
    cmds:
      - pnpm install
      - cd {{.API_DIR}} && go mod download

  # ---- Infra ----
  up:
    desc: Start Postgres, Redis, Mailpit, Jaeger
    cmds:
      - docker compose up -d
  down:
    desc: Stop infra
    cmds:
      - docker compose down
  nuke:
    desc: Stop infra and delete volumes
    cmds:
      - docker compose down -v
      - rm -rf .data

  # ---- Proto ----
  proto:
    desc: Generate Go + TS code from proto
    cmds:
      - buf generate
  proto:lint:
    desc: Lint proto
    cmds:
      - buf lint
  proto:fmt:
    desc: Format proto
    cmds:
      - buf format -w

  # ---- Database ----
  # Each service owns its goose version table (goose_<service>) so version
  # numbers never collide in a shared database.
  migrate:
    desc: Apply every service's DB migrations
    cmds:
      - goose -dir services/identity/migrations -table goose_identity postgres "$DATABASE_URL" up
      - goose -dir services/scheduling/migrations -table goose_scheduling postgres "$DATABASE_URL" up
      - goose -dir services/contact/migrations -table goose_contact postgres "$DATABASE_URL" up
      - goose -dir services/template/migrations -table goose_template postgres "$DATABASE_URL" up
      - goose -dir services/notification/migrations -table goose_notification postgres "$DATABASE_URL" up
  migrate:down:
    desc: Roll back the last migration for SVC — task migrate:down SVC=scheduling
    vars:
      SVC: '{{.SVC | default "identity"}}'
    cmds:
      - goose -dir services/{{.SVC}}/migrations -table goose_{{.SVC}} postgres "$DATABASE_URL" down
  migrate:new:
    desc: New migration for SVC — task migrate:new SVC=identity -- add_thing
    vars:
      SVC: '{{.SVC | default "identity"}}'
    cmds:
      - goose -dir services/{{.SVC}}/migrations create {{.CLI_ARGS}} sql

  # ---- Backend ----
  api:run:
    desc: Run the API server
    dir: "{{.API_DIR}}"
    cmds:
      - go run ./cmd/server
  api:build:
    desc: Build the API binary
    dir: "{{.API_DIR}}"
    cmds:
      - go build -o bin/halomail-api ./cmd/server
  api:test:
    desc: Run Go tests
    dir: "{{.API_DIR}}"
    cmds:
      - go test ./... -race -count=1
  test:
    desc: Run Go tests in every service module
    cmds:
      - for: [shared, gateway, identity, scheduling, contact, template, notification]
        cmd: cd services/{{.ITEM}} && go test ./... -race -count=1
  api:lint:
    desc: Vet + golangci-lint
    dir: "{{.API_DIR}}"
    cmds:
      - go vet ./...
      - golangci-lint run

  # ---- Frontend ----
  web:
    desc: Run the Next.js web app
    cmds:
      - pnpm --filter @halomail/web dev
  docs:
    desc: Run the docs site
    cmds:
      - pnpm --filter @halomail/docs dev
  sdk:gen:
    desc: Regenerate the TS SDK from proto
    cmds:
      - buf generate
      - pnpm --filter @halomail/sdk build

  # ---- Dev (everything) ----
  dev:
    desc: Infra up + API + web together
    deps: [up]
    cmds:
      - echo "Infra up. Run 'task api:run' and 'task web' in separate terminals."
