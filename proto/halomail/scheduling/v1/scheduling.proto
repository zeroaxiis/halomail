syntax = "proto3";

package halomail.scheduling.v1;

import "google/protobuf/timestamp.proto";
import "halomail/common/v1/common.proto";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

enum LocationKind {
  LOCATION_KIND_UNSPECIFIED = 0;
  LOCATION_KIND_GOOGLE_MEET = 1;
  LOCATION_KIND_ZOOM = 2;
  LOCATION_KIND_PHONE = 3;
  LOCATION_KIND_IN_PERSON = 4;
  LOCATION_KIND_CUSTOM = 5;
}

enum BookingStatus {
  BOOKING_STATUS_UNSPECIFIED = 0;
  BOOKING_STATUS_CONFIRMED = 1;
  BOOKING_STATUS_CANCELLED = 2;
  BOOKING_STATUS_RESCHEDULED = 3;
}

enum CalendarProvider {
  CALENDAR_PROVIDER_UNSPECIFIED = 0;
  CALENDAR_PROVIDER_GOOGLE = 1;
  CALENDAR_PROVIDER_OUTLOOK = 2;
}

// ---------------------------------------------------------------------------
// Entities
// ---------------------------------------------------------------------------

// EventType is a bookable meeting template (e.g. "30 min intro call").
message EventType {
  string id = 1;
  string owner_id = 2;
  string slug = 3;
  string title = 4;
  string description = 5;
  int32 duration_minutes = 6;
  LocationKind location_kind = 7;
  string location_detail = 8;
  int32 buffer_before_minutes = 9;
  int32 buffer_after_minutes = 10;
  string color = 11;
  bool active = 12;
  google.protobuf.Timestamp created_at = 13;
}

// AvailabilityRule is a weekly recurring open window, in the owner's timezone.
message AvailabilityRule {
  // 0=Sunday .. 6=Saturday.
  int32 weekday = 1;
  // Minutes from midnight.
  int32 start_minute = 2;
  int32 end_minute = 3;
}

// DateOverride blocks or opens a specific date, overriding the weekly rules.
message DateOverride {
  // ISO date "2026-06-12".
  string date = 1;
  bool unavailable = 2;
  int32 start_minute = 3;
  int32 end_minute = 4;
}

message Availability {
  string owner_id = 1;
  string timezone = 2;
  repeated AvailabilityRule rules = 3;
  repeated DateOverride overrides = 4;
}

message Slot {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message Booking {
  string id = 1;
  string event_type_id = 2;
  string owner_id = 3;
  string invitee_name = 4;
  string invitee_email = 5;
  string invitee_timezone = 6;
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;
  BookingStatus status = 9;
  string location = 10;
  string notes = 11;
  // Opaque tokens powering public reschedule/cancel links.
  string reschedule_token = 12;
  string cancel_token = 13;
  google.protobuf.Timestamp created_at = 14;
}

message CalendarConnection {
  string id = 1;
  string owner_id = 2;
  CalendarProvider provider = 3;
  string email = 4;
  google.protobuf.Timestamp connected_at = 5;
}

// ---------------------------------------------------------------------------
// EventTypeService
// ---------------------------------------------------------------------------

service EventTypeService {
  rpc CreateEventType(CreateEventTypeRequest) returns (CreateEventTypeResponse);
  rpc GetEventType(GetEventTypeRequest) returns (GetEventTypeResponse);
  rpc ListEventTypes(ListEventTypesRequest) returns (ListEventTypesResponse);
  rpc UpdateEventType(UpdateEventTypeRequest) returns (UpdateEventTypeResponse);
  rpc DeleteEventType(DeleteEventTypeRequest) returns (DeleteEventTypeResponse);
}

message CreateEventTypeRequest {
  string title = 1;
  string slug = 2;
  string description = 3;
  int32 duration_minutes = 4;
  LocationKind location_kind = 5;
  string location_detail = 6;
  int32 buffer_before_minutes = 7;
  int32 buffer_after_minutes = 8;
  string color = 9;
}
message CreateEventTypeResponse {
  EventType event_type = 1;
}

message GetEventTypeRequest {
  string id = 1;
}
message GetEventTypeResponse {
  EventType event_type = 1;
}

message ListEventTypesRequest {
  // When set, returns the public, active event types for this user handle.
  string owner_handle = 1;
}
message ListEventTypesResponse {
  repeated EventType event_types = 1;
}

message UpdateEventTypeRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 duration_minutes = 4;
  LocationKind location_kind = 5;
  string location_detail = 6;
  int32 buffer_before_minutes = 7;
  int32 buffer_after_minutes = 8;
  string color = 9;
  bool active = 10;
}
message UpdateEventTypeResponse {
  EventType event_type = 1;
}

message DeleteEventTypeRequest {
  string id = 1;
}
message DeleteEventTypeResponse {}

// ---------------------------------------------------------------------------
// AvailabilityService
// ---------------------------------------------------------------------------

service AvailabilityService {
  rpc GetAvailability(GetAvailabilityRequest) returns (GetAvailabilityResponse);
  rpc SetAvailability(SetAvailabilityRequest) returns (SetAvailabilityResponse);
}

message GetAvailabilityRequest {
  string owner_id = 1;
}
message GetAvailabilityResponse {
  Availability availability = 1;
}

message SetAvailabilityRequest {
  string timezone = 1;
  repeated AvailabilityRule rules = 2;
  repeated DateOverride overrides = 3;
}
message SetAvailabilityResponse {
  Availability availability = 1;
}

// ---------------------------------------------------------------------------
// BookingService
// ---------------------------------------------------------------------------

service BookingService {
  // ListSlots is public: computes free slots for an event type in a range.
  rpc ListSlots(ListSlotsRequest) returns (ListSlotsResponse);
  // CreateBooking is public: books a slot for an invitee.
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);
  rpc GetBooking(GetBookingRequest) returns (GetBookingResponse);
  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse);
  // RescheduleBooking is public via the reschedule_token from the email.
  rpc RescheduleBooking(RescheduleBookingRequest) returns (RescheduleBookingResponse);
  // CancelBooking is public via the cancel_token from the email.
  rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse);
  rpc GetUsageStats(GetUsageStatsRequest) returns (GetUsageStatsResponse);
}

message ListSlotsRequest {
  string event_type_id = 1;
  // Inclusive ISO date range in the invitee's timezone.
  string from_date = 2;
  string to_date = 3;
  string invitee_timezone = 4;
}
message ListSlotsResponse {
  repeated Slot slots = 1;
}

message CreateBookingRequest {
  string event_type_id = 1;
  string invitee_name = 2;
  string invitee_email = 3;
  string invitee_timezone = 4;
  google.protobuf.Timestamp start = 5;
  string notes = 6;
}
message CreateBookingResponse {
  Booking booking = 1;
}

message GetBookingRequest {
  string id = 1;
}
message GetBookingResponse {
  Booking booking = 1;
}

message ListBookingsRequest {
  BookingStatus status = 1;
  halomail.common.v1.PageRequest page = 2;
}
message ListBookingsResponse {
  repeated Booking bookings = 1;
  halomail.common.v1.PageResponse page = 2;
}

message RescheduleBookingRequest {
  string reschedule_token = 1;
  google.protobuf.Timestamp new_start = 2;
}
message RescheduleBookingResponse {
  Booking booking = 1;
}

message CancelBookingRequest {
  string cancel_token = 1;
  string reason = 2;
}
message CancelBookingResponse {
  Booking booking = 1;
}

message GetUsageStatsRequest {}
message GetUsageStatsResponse {
  int32 total_bookings = 1;
  int32 upcoming_bookings = 2;
  int32 cancelled_bookings = 3;
}


// ---------------------------------------------------------------------------
// CalendarService — OAuth calendar sync
// ---------------------------------------------------------------------------

service CalendarService {
  // StartConnect returns a provider OAuth consent URL to redirect the user to.
  rpc StartConnect(StartConnectRequest) returns (StartConnectResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc DisconnectCalendar(DisconnectCalendarRequest) returns (DisconnectCalendarResponse);
}

message StartConnectRequest {
  CalendarProvider provider = 1;
}
message StartConnectResponse {
  string authorization_url = 1;
}

message ListConnectionsRequest {}
message ListConnectionsResponse {
  repeated CalendarConnection connections = 1;
}

message DisconnectCalendarRequest {
  string id = 1;
}
message DisconnectCalendarResponse {}
