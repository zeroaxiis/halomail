syntax = "proto3";

package halomail.identity.v1;

import "google/protobuf/timestamp.proto";
import "halomail/common/v1/common.proto";

// ---------------------------------------------------------------------------
// Entities
// ---------------------------------------------------------------------------

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  // Unique handle used in public booking URLs: /book/{handle}.
  string handle = 4;
  string avatar_url = 5;
  // IANA timezone, e.g. "Europe/Berlin".
  string timezone = 6;
  string org_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string role = 10;
}

message Org {
  string id = 1;
  string name = 2;
  string slug = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Session holds the token pair returned by auth flows.
message Session {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
}

message ApiKey {
  string id = 1;
  string name = 2;
  // Public, non-secret prefix shown in the dashboard, e.g. "hl_live".
  string prefix = 3;
  // Last four chars of the secret, for identification.
  string last_four = 4;
  repeated string scopes = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
  bool revoked = 8;
}

message AuditLog {
  string id = 1;
  string actor_id = 2;
  // e.g. "apikey.created", "booking.cancelled".
  string action = 3;
  string target_type = 4;
  string target_id = 5;
  // JSON-encoded extra context.
  string metadata = 6;
  string ip = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ---------------------------------------------------------------------------
// AuthService — registration, login, sessions
// ---------------------------------------------------------------------------

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  // VerifyToken is internal: the gateway calls it to authenticate requests.
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}
message RegisterResponse {
  User user = 1;
  Session session = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}
message LoginResponse {
  User user = 1;
  Session session = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}
message LogoutResponse {}

message RefreshSessionRequest {
  string refresh_token = 1;
}
message RefreshSessionResponse {
  Session session = 1;
}

message GetCurrentUserRequest {}
message GetCurrentUserResponse {
  User user = 1;
}

message VerifyTokenRequest {
  string access_token = 1;
}
message VerifyTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string org_id = 3;
}

message ForgotPasswordRequest {
  string email = 1;
}
message ForgotPasswordResponse {
  bool success = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}
message ResetPasswordResponse {
  bool success = 1;
}

// ---------------------------------------------------------------------------
// UserService — profiles
// ---------------------------------------------------------------------------

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // GetUserByHandle returns the public profile backing a booking page.
  rpc GetUserByHandle(GetUserByHandleRequest) returns (GetUserByHandleResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
}

message GetUserRequest {
  string id = 1;
}
message GetUserResponse {
  User user = 1;
}

message GetUserByHandleRequest {
  string handle = 1;
}
message GetUserByHandleResponse {
  User user = 1;
}

message UpdateUserRequest {
  string name = 1;
  string handle = 2;
  string avatar_url = 3;
  string timezone = 4;
}
message UpdateUserResponse {
  User user = 1;
}

// ---------------------------------------------------------------------------
// ApiKeyService — developer keys
// ---------------------------------------------------------------------------

service ApiKeyService {
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  // VerifyApiKey is internal: the gateway resolves a raw key to its owner.
  rpc VerifyApiKey(VerifyApiKeyRequest) returns (VerifyApiKeyResponse);
}

message CreateApiKeyRequest {
  string name = 1;
  repeated string scopes = 2;
}
message CreateApiKeyResponse {
  ApiKey key = 1;
  // Plaintext secret — shown exactly once.
  string secret = 2;
}

message ListApiKeysRequest {}
message ListApiKeysResponse {
  repeated ApiKey keys = 1;
}

message RevokeApiKeyRequest {
  string id = 1;
}
message RevokeApiKeyResponse {}

message VerifyApiKeyRequest {
  string secret = 1;
}
message VerifyApiKeyResponse {
  bool valid = 1;
  string user_id = 2;
  string org_id = 3;
  repeated string scopes = 4;
}

// ---------------------------------------------------------------------------
// AuditService — audit trail
// ---------------------------------------------------------------------------

service AuditService {
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  // RecordAuditLog is internal: other services append entries.
  rpc RecordAuditLog(RecordAuditLogRequest) returns (RecordAuditLogResponse);
}

message ListAuditLogsRequest {
  halomail.common.v1.PageRequest page = 1;
}
message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  halomail.common.v1.PageResponse page = 2;
}

message RecordAuditLogRequest {
  string actor_id = 1;
  string action = 2;
  string target_type = 3;
  string target_id = 4;
  string metadata = 5;
  string ip = 6;
}
message RecordAuditLogResponse {
  string id = 1;
}

// ---------------------------------------------------------------------------
// TeamService — team members, roles, invitations
// ---------------------------------------------------------------------------

message TeamMember {
  string id = 1;
  string email = 2;
  string name = 3;
  string handle = 4;
  string avatar_url = 5;
  string role = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Invitation {
  string id = 1;
  string email = 2;
  string role = 3;
  string invited_by_name = 4;
  string status = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  string token = 8;
}

service TeamService {
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse);
  rpc InviteTeamMember(InviteTeamMemberRequest) returns (InviteTeamMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
}

message ListTeamMembersRequest {}
message ListTeamMembersResponse {
  repeated TeamMember members = 1;
  repeated Invitation invitations = 2;
  int32 max_seats = 3;
  int32 used_seats = 4;
  string tier = 5;
  string current_user_role = 6;
}

message InviteTeamMemberRequest {
  string email = 1;
  string role = 2;
}
message InviteTeamMemberResponse {
  Invitation invitation = 1;
}

message UpdateMemberRoleRequest {
  string user_id = 1;
  string role = 2;
}
message UpdateMemberRoleResponse {
  TeamMember member = 1;
}

message RemoveTeamMemberRequest {
  string user_id = 1;
}
message RemoveTeamMemberResponse {}

message RevokeInvitationRequest {
  string invitation_id = 1;
}
message RevokeInvitationResponse {}

message AcceptInvitationRequest {
  string token = 1;
}
message AcceptInvitationResponse {
  User user = 1;
  Session session = 2;
}
