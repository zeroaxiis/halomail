# Render blueprint for the HaloMail backend (monolith mode), free plan.
# Set secret env vars (DATABASE_URL, JWT_SECRET, RESEND_API_KEY, …) in the
# Render dashboard — they are intentionally not in this file.
services:
  - type: web
    name: halomail-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_PORT
        value: "8080"
      - key: LOG_FORMAT
        value: json
      # No OTLP collector on the free plan; true would retry against
      # localhost:4318 on every span.
      - key: OTEL_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
